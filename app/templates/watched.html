<!DOCTYPE html>
<html lang="en" class="h-full bg-neutral-950 text-neutral-100 selection:bg-emerald-500 selection:text-neutral-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDB - Watched Titles</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes toast-in {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-toast { animation: toast-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased bg-neutral-950 text-neutral-100">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Top Navigation Bar -->
    <nav class="sticky top-0 z-40 bg-neutral-900/90 backdrop-blur-md border-b border-neutral-800/80 px-6 py-3.5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">

            <!-- Brand & Links -->
            <div class="flex items-center space-x-8">
                <a href="/" class="flex items-center space-x-2">
                    <img src="/static/img/logo.png" alt="Logo" class="h-8 w-auto object-contain">
                </a>
                <div class="flex items-center space-x-2 text-sm font-semibold">
                    <a href="/" class="px-4 py-1.5 rounded-full text-neutral-400 hover:text-white hover:bg-neutral-800/60 transition-all duration-200">
                        Search
                    </a>
                    <a href="/to-watch" class="px-4 py-1.5 rounded-full text-neutral-400 hover:text-white hover:bg-neutral-800/60 transition-all duration-200">
                        Want To Watch
                    </a>
                    <a href="/watched" class="px-4 py-1.5 rounded-full bg-neutral-800 text-white border border-neutral-700/50 shadow-sm transition-all duration-200">
                        Watched
                    </a>
                </div>
            </div>

            <!-- Profile Info & Edit Trigger -->
            {% if current_user %}
            <button type="button"
                    hx-get="/profile/edit-modal"
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                    class="flex items-center space-x-3 bg-neutral-900/80 hover:bg-neutral-800 border border-neutral-800 hover:border-neutral-700 rounded-full px-3.5 py-1.5 transition-all cursor-pointer"
                    title="Edit Profile">
                {% if current_user.avatar_url %}
                    <img src="{{ current_user.avatar_url }}" alt="{{ current_user.username }}" class="w-6 h-6 rounded-full object-cover border border-emerald-500/60">
                {% else %}
                    <div class="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center text-neutral-950 font-extrabold text-xs uppercase">
                        {{ current_user.username[0] if current_user.username else 'U' }}
                    </div>
                {% endif %}
                <span class="text-xs font-semibold text-neutral-300">{{ current_user.username }}</span>
            </button>
            {% endif %}
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8">
        <div class="flex justify-between items-end border-b border-neutral-800/80 pb-4 mb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">My Library</h1>
                <p class="text-sm text-neutral-400 mt-1">Titles you have watched and rated.</p>
            </div>
            <span class="text-xs font-bold uppercase tracking-wider text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-3 py-1 rounded-full">
                {{ entries|length }} Watched
            </span>
        </div>

        <div id="watched-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {% for entry in entries %}
                {% include "partials/watched_card.html" %}
            {% else %}
                <div class="col-span-full py-16 text-center bg-neutral-900/40 border border-dashed border-neutral-800/80 rounded-2xl">
                    <p class="text-neutral-400 font-medium">No watched items yet.</p>
                    <a href="/" class="inline-block mt-3 text-sm font-semibold text-emerald-400 hover:underline">Search for titles to add</a>
                </div>
            {% endfor %}
        </div>
    </main>

    <!-- Container for dynamic HTMX modals -->
    <div id="modal-container"></div>

    <!-- Auto-dismiss toast observer -->
    <script>
        document.addEventListener('htmx:afterSettle', function(evt) {
            const toasts = document.querySelectorAll('#toast-container > div:not([data-timer])');
            toasts.forEach(toast => {
                toast.setAttribute('data-timer', 'true');
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(10px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            });
        });
    </script>
</body>
</html>
