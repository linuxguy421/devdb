{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <!-- Header & Status Filter Tabs -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-neutral-800 pb-5">
        <div>
            <h1 class="text-3xl font-bold tracking-tight text-white">My Media</h1>
            <p class="text-sm text-neutral-400 mt-1">Track progress, manage watchlist, and log completed titles.</p>
        </div>

        <nav class="flex items-center space-x-1 bg-neutral-900/80 p-1 rounded-xl border border-neutral-800 self-start sm:self-auto">
            <a href="/my-media?status=in_progress" 
               class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-colors {% if current_status == 'in_progress' %}bg-emerald-500/20 text-emerald-400 border border-emerald-500/30{% else %}text-neutral-400 hover:text-white{% endif %}">
               In Progress
            </a>
            <a href="/my-media?status=want_to_watch" 
               class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-colors {% if current_status == 'want_to_watch' %}bg-emerald-500/20 text-emerald-400 border border-emerald-500/30{% else %}text-neutral-400 hover:text-white{% endif %}">
               Want to Watch
            </a>
            <a href="/my-media?status=watched" 
               class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-colors {% if current_status == 'watched' %}bg-emerald-500/20 text-emerald-400 border border-emerald-500/30{% else %}text-neutral-400 hover:text-white{% endif %}">
               Watched
            </a>
            <a href="/my-media?status=all" 
               class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-colors {% if current_status == 'all' %}bg-emerald-500/20 text-emerald-400 border border-emerald-500/30{% else %}text-neutral-400 hover:text-white{% endif %}">
               All
            </a>
        </nav>
    </div>

    <!-- Media Grid -->
    <div id="media-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5">
        {% for entry in entries %}
            {% include "partials/my_media_card.html" %}
        {% else %}
            <div class="col-span-full py-16 text-center bg-neutral-900/40 rounded-2xl border border-dashed border-neutral-800">
                <p class="text-neutral-400 text-sm font-medium">No titles found in this list.</p>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
