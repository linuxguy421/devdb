<div class="space-y-6">
    <!-- Change Password Form -->
    <div class="space-y-4">
        <div>
            <h4 class="text-xs font-bold text-white uppercase tracking-wider">Change Password</h4>
            <p class="text-xs text-neutral-400 mt-0.5">Update your account password</p>
        </div>

        <div id="password-change-msg"></div>

        <form hx-post="/profile/change-password" hx-target="#password-change-msg" hx-swap="innerHTML" class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1.5">Current Password</label>
                <input type="password" name="current_password" required placeholder="••••••••"
                       class="w-full bg-neutral-800 border border-neutral-700/80 rounded-xl px-4 py-2 text-sm text-white focus:border-emerald-500 outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1.5">New Password</label>
                <input type="password" name="new_password" required placeholder="••••••••"
                       class="w-full bg-neutral-800 border border-neutral-700/80 rounded-xl px-4 py-2 text-sm text-white focus:border-emerald-500 outline-none transition">
            </div>

            <div class="flex justify-end pt-1">
                <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold px-4 py-2 rounded-xl transition text-xs cursor-pointer shadow-md shadow-emerald-950/40">
                    Update Password
                </button>
            </div>
        </form>
    </div>

    <hr class="border-neutral-800">

    <!-- Backup Recovery Codes -->
    <div class="bg-neutral-950/60 border border-neutral-800 rounded-xl p-4 flex items-center justify-between">
        <div>
            <h4 class="text-xs font-bold text-white uppercase tracking-wider">Account Recovery Codes</h4>
            <p class="text-xs text-neutral-400 mt-0.5">
                Active Codes: <span class="font-bold text-emerald-400">{{ active_recovery_codes_count if active_recovery_codes_count is defined else 0 }}</span>
            </p>
        </div>
        <button type="button"
                hx-post="/profile/recovery-codes/regenerate"
                hx-target="body"
                hx-swap="beforeend"
                class="bg-neutral-800 hover:bg-neutral-700 text-amber-400 hover:text-amber-300 font-bold border border-amber-500/20 px-3.5 py-2 rounded-xl text-xs transition cursor-pointer">
            Generate New Codes
        </button>
    </div>
</div>
