<form hx-post="/profile/update" class="space-y-4">
    <div>
        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-2">Username</label>
        <input type="text" name="username" value="{{ current_user.username }}" required
               class="w-full bg-neutral-800 border border-neutral-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 outline-none transition">
    </div>

    <div>
        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-2">Avatar Image URL</label>
        <input type="url" name="avatar_url" value="{{ current_user.avatar_url or '' }}" placeholder="https://example.com/avatar.jpg"
               class="w-full bg-neutral-800 border border-neutral-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 outline-none transition">
    </div>

    <div>
        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-2">Bio</label>
        <textarea name="bio" rows="3" placeholder="Tell your buddies what you're watching..."
                  class="w-full bg-neutral-800 border border-neutral-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 outline-none transition resize-none">{{ current_user.bio or '' }}</textarea>
    </div>

    <div class="pt-4 flex justify-end">
        <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold px-5 py-2 rounded-xl transition text-sm cursor-pointer shadow-md shadow-emerald-950/40">
            Save Profile
        </button>
    </div>
</form>
