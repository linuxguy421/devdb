<div id="profile-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col max-h-[90vh]">

        <!-- Header -->
        <div class="p-5 bg-neutral-900 border-b border-neutral-800 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                {% if current_user.avatar_url %}
                <img src="{{ current_user.avatar_url }}" alt="{{ current_user.username }}" class="w-10 h-10 rounded-full object-cover border border-neutral-700">
                {% else %}
                <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-neutral-950 font-extrabold text-base uppercase shadow-md">
                    {{ current_user.username[0] }}
                </div>
                {% endif %}
                <div>
                    <h2 class="text-xl font-extrabold text-white">{{ current_user.username }}</h2>
                    <p class="text-xs text-neutral-400">Account Settings & Profile</p>
                </div>
            </div>
            <button onclick="document.getElementById('profile-modal').remove()" class="text-neutral-400 hover:text-white p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="p-5 space-y-6 overflow-y-auto flex-1">

            <!-- Stats Bar -->
            <div class="grid grid-cols-3 gap-3 bg-neutral-950/60 p-3 rounded-xl border border-neutral-800/80 text-center">
                <div>
                    <span class="block text-lg font-black text-white">{{ stats.watched }}</span>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Watched</span>
                </div>
                <div>
                    <span class="block text-lg font-black text-emerald-400">{{ stats.to_watch }}</span>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Want To Watch</span>
                </div>
                <div>
                    <span class="block text-lg font-black text-white">{{ stats.buddies }}</span>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Buddies</span>
                </div>
            </div>

            <!-- Profile Info Form -->
            <form hx-post="/profile/update-info" hx-target="#info-status" class="space-y-4">
                <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400">Profile Details</h3>
                <div id="info-status"></div>

                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-neutral-300">Email Address</label>
                    <input type="email" name="email" value="{{ current_user.email or '' }}" placeholder="you@example.com"
                           class="w-full bg-neutral-800 border border-neutral-700 text-white rounded-xl px-3.5 py-2 text-sm focus:border-emerald-500 outline-none">
                </div>

                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-neutral-300">Avatar Image URL</label>
                    <input type="url" name="avatar_url" value="{{ current_user.avatar_url or '' }}" placeholder="https://example.com/avatar.jpg"
                           class="w-full bg-neutral-800 border border-neutral-700 text-white rounded-xl px-3.5 py-2 text-sm focus:border-emerald-500 outline-none">
                </div>

                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-neutral-300">Bio / About</label>
                    <textarea name="bio" rows="2" placeholder="Tell your buddies what you like to watch..."
                              class="w-full bg-neutral-800 border border-neutral-700 text-white rounded-xl px-3.5 py-2 text-sm focus:border-emerald-500 outline-none resize-none">{{ current_user.bio or '' }}</textarea>
                </div>

                <button type="submit" class="w-full text-xs font-bold bg-neutral-800 hover:bg-neutral-700 text-white py-2.5 rounded-xl border border-neutral-700/60 transition">
                    Save Profile Info
                </button>
            </form>

            <hr class="border-neutral-800">

            <!-- Security / Password Form -->
            <form hx-post="/profile/change-password" hx-target="#password-status" class="space-y-4">
                <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400">Security & Password</h3>
                <div id="password-status"></div>

                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-neutral-300">Current Password</label>
                    <input type="password" name="current_password" required placeholder="••••••••"
                           class="w-full bg-neutral-800 border border-neutral-700 text-white rounded-xl px-3.5 py-2 text-sm focus:border-emerald-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-neutral-300">New Password</label>
                        <input type="password" name="new_password" required placeholder="••••••••"
                               class="w-full bg-neutral-800 border border-neutral-700 text-white rounded-xl px-3.5 py-2 text-sm focus:border-emerald-500 outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-neutral-300">Confirm New</label>
                        <input type="password" name="confirm_password" required placeholder="••••••••"
                               class="w-full bg-neutral-800 border border-neutral-700 text-white rounded-xl px-3.5 py-2 text-sm focus:border-emerald-500 outline-none">
                    </div>
                </div>

                <button type="submit" class="w-full text-xs font-bold bg-emerald-500 hover:bg-emerald-400 text-neutral-950 py-2.5 rounded-xl shadow-lg transition">
                    Update Password
                </button>
            </form>

        </div>
    </div>
</div>
