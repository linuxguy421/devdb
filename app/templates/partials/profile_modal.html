<div id="profile-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
    <div class="bg-neutral-900 border border-neutral-800 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
        
        <!-- Modal Header & Tabs -->
        <div class="border-b border-neutral-800 p-6 pb-0 bg-neutral-950/50">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center space-x-3.5">
                    {% if current_user.avatar_url %}
                        <img src="{{ current_user.avatar_url }}" class="w-11 h-11 rounded-full object-cover border-2 border-emerald-500/80 shadow-md shadow-emerald-950/40">
                    {% else %}
                        <div class="w-11 h-11 rounded-full bg-emerald-500 flex items-center justify-center text-neutral-950 font-black text-base uppercase shadow-md shadow-emerald-950/40">
                            {{ current_user.username[0] if current_user.username else 'U' }}
                        </div>
                    {% endif %}
                    <div>
                        <h3 class="text-lg font-bold text-white tracking-tight">{{ current_user.username }}</h3>
                        <p class="text-xs text-neutral-400 font-medium">Account & Preference Center</p>
                    </div>
                </div>
                <button onclick="document.getElementById('profile-modal').remove()" class="text-neutral-400 hover:text-white p-2 rounded-xl hover:bg-neutral-800 transition cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Tab Buttons -->
            <div class="flex space-x-6 text-sm font-semibold">
                <button hx-get="/profile/tab/edit"
                        hx-target="#profile-tab-content"
                        onclick="setActiveTab(this)"
                        class="tab-btn pb-3 border-b-2 border-emerald-500 text-white transition cursor-pointer">
                    Edit Profile
                </button>
                <button hx-get="/profile/tab/buddies"
                        hx-target="#profile-tab-content"
                        onclick="setActiveTab(this)"
                        class="tab-btn pb-3 border-b-2 border-transparent text-neutral-400 hover:text-neutral-200 transition cursor-pointer">
                    Manage Buddies
                </button>
                <button hx-get="/profile/tab/settings"
                        hx-target="#profile-tab-content"
                        onclick="setActiveTab(this)"
                        class="tab-btn pb-3 border-b-2 border-transparent text-neutral-400 hover:text-neutral-200 transition cursor-pointer">
                    Account Stats
                </button>
            </div>
        </div>

        <!-- Dynamic Content Body -->
        <div id="profile-tab-content" class="p-6 overflow-y-auto space-y-4 flex-1">
            {% include "partials/profile_tab_edit.html" %}
        </div>
    </div>
</div>

<script>
function setActiveTab(element) {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('border-emerald-500', 'text-white');
        btn.classList.add('border-transparent', 'text-neutral-400');
    });
    element.classList.remove('border-transparent', 'text-neutral-400');
    element.classList.add('border-emerald-500', 'text-white');
}
</script>
