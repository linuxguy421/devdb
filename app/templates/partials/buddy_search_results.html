{% for user in users %}
    {% set status = status_map.get(user.id) %}
    <div class="flex items-center justify-between bg-neutral-950/60 p-3 rounded-xl border border-neutral-800">
        <div class="flex items-center space-x-3">
            <div class="w-7 h-7 rounded-full bg-emerald-500 flex items-center justify-center text-neutral-950 font-bold text-xs uppercase">
                {{ user.username[0] }}
            </div>
            <span class="text-sm font-semibold text-neutral-200">{{ user.username }}</span>
        </div>

        <div id="buddy-action-{{ user.id }}">
            {% if status == 'accepted' %}
                <span class="text-xs font-semibold text-emerald-400 bg-emerald-950/50 border border-emerald-800/40 px-3 py-1 rounded-full">Buddies</span>
            {% elif status == 'pending' %}
                <span class="text-xs font-semibold text-neutral-400 bg-neutral-800 px-3 py-1 rounded-full">Pending</span>
            {% else %}
                <button hx-post="/buddies/request/{{ user.id }}"
                        hx-target="#buddy-action-{{ user.id }}"
                        hx-swap="innerHTML"
                        class="text-xs font-extrabold bg-emerald-500 text-neutral-950 hover:bg-emerald-400 px-3 py-1 rounded-full shadow transition">
                    + Add Buddy
                </button>
            {% endif %}
        </div>
    </div>
{% else %}
    <p class="text-xs text-neutral-500 italic py-2 text-center">No users found matching that name.</p>
{% endfor %}
