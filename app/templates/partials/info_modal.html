<div id="info-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full mx-4 overflow-hidden flex flex-col max-h-[90vh]">
        
        <div class="p-6 overflow-y-auto">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">{{ title }}</h2>
            
            <div class="flex space-x-4 text-sm text-gray-500 mb-4 border-b pb-4">
                <span>⭐ {{ vote_average }}/10</span>
                <span>📅 {{ release_date }}</span>
            </div>
            
            <p class="text-gray-700 leading-relaxed">
                {{ overview }}
            </p>
        </div>
        
        <div class="bg-gray-50 p-4 border-t flex justify-end">
            <button onclick="document.getElementById('info-modal').remove()" 
                    class="px-4 py-2 bg-gray-200 text-gray-800 rounded shadow-sm hover:bg-gray-300 font-medium">
                Close
            </button>
        </div>
        
    </div>
</div>
