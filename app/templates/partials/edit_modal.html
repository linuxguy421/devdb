<div id="info-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden flex flex-col max-h-[90vh]">

        <!-- Header Info Area -->
        <div class="p-6 bg-neutral-900/90 border-b border-neutral-800 flex gap-5">
            <div class="w-24 h-36 bg-neutral-800 rounded-lg shadow-md shrink-0 overflow-hidden border border-neutral-700/50">
                {% if entry.tmdb_data.poster_path %}
                    <img src="https://image.tmdb.org/t/p/w154{{ entry.tmdb_data.poster_path }}" class="w-full h-full object-cover">
                {% endif %}
            </div>
            <div class="flex-1 overflow-y-auto">
                <h2 class="text-2xl font-extrabold text-white leading-tight">{{ entry.tmdb_data.title }}</h2>
                <div class="flex items-center space-x-3 text-xs mt-1.5 mb-3">
                    <span class="bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 px-2 py-0.5 rounded font-bold">IMDb {{ entry.tmdb_data.imdb_rating }}</span>
                    <span class="text-neutral-400 uppercase tracking-wider font-semibold">{{ entry.media_type }}</span>
                </div>
                <p class="text-xs text-neutral-400"><strong class="text-neutral-200">Director:</strong> {{ entry.tmdb_data.director }}</p>
                <p class="text-xs text-neutral-400 mt-0.5"><strong class="text-neutral-200">Cast:</strong> {{ entry.tmdb_data.actors }}</p>
                <p class="text-xs text-neutral-300 mt-3 leading-relaxed line-clamp-3 bg-neutral-950/40 p-2.5 rounded-lg border border-neutral-800/60">{{ entry.tmdb_data.overview }}</p>
            </div>
        </div>

        <!-- Form Area -->
        <form hx-post="/watch-entries/{{ entry.id }}/update"
              hx-target="#entry-{{ entry.id }}"
              hx-swap="outerHTML"
              hx-on::after-request="if (event.detail.successful) document.getElementById('info-modal').remove()"
              class="p-6 flex flex-col gap-4 overflow-y-auto bg-neutral-900">

            <div class="flex items-center gap-4">
                <label class="font-semibold text-sm text-neutral-300 w-24">My Rating:</label>
                <select name="rating" class="bg-neutral-800 border border-neutral-700 text-white rounded-lg p-2.5 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none">
                    <option value="">Unrated</option>
                    {% for i in range(1, 11) %}
                        <option value="{{ i }}" {% if entry.rating == i %}selected{% endif %}>{{ i }} / 10</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex items-start gap-4">
                <label class="font-semibold text-sm text-neutral-300 w-24 pt-2">Notes:</label>
                <textarea name="notes" rows="3" placeholder="What did you think of it?"
                          class="w-full bg-neutral-800 border border-neutral-700 text-white rounded-lg p-2.5 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none resize-none placeholder-neutral-500">{{ entry.notes or '' }}</textarea>
            </div>

            <!-- Modal Actions -->
            <div class="flex justify-end space-x-3 mt-4 pt-4 border-t border-neutral-800">
                <button type="button" onclick="document.getElementById('info-modal').remove()"
                        class="px-5 py-2 text-sm text-neutral-300 hover:text-white bg-neutral-800 rounded-full hover:bg-neutral-700 font-semibold transition-colors">
                    Cancel
                </button>
                <button type="submit"
                        class="px-5 py-2 text-sm text-neutral-950 bg-emerald-500 rounded-full hover:bg-emerald-400 font-extrabold shadow-lg shadow-emerald-950/40 transition-all">
                    Save Changes
                </button>
            </div>
        </form>

    </div>
</div>
