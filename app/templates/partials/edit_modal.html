{% set m_item = entry.media_item %}
<div id="info-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-3 sm:p-6 animate-in fade-in duration-200">
    <div class="absolute inset-0" onclick="document.getElementById('info-modal')?.remove()"></div>

    <div class="relative bg-neutral-900 border border-neutral-800 rounded-2xl max-w-xl w-full overflow-hidden shadow-2xl z-10 flex flex-col max-h-[90vh]">
        <form hx-post="/watch-entries/{{ entry.id }}/edit"
              hx-target="#info-modal"
              hx-swap="outerHTML"
              class="flex flex-col flex-1 min-h-0">
            
            <div class="p-6 border-b border-neutral-800 flex items-center justify-between bg-neutral-950 shrink-0">
                <div>
                    <h2 class="text-xl font-bold text-white tracking-tight">Edit Watch Entry</h2>
                    <p class="text-xs text-neutral-400 mt-0.5">{{ m_item.title }}</p>
                </div>
                <button type="button" onclick="document.getElementById('info-modal')?.remove()"
                        class="text-neutral-400 hover:text-white bg-neutral-900 p-2 rounded-full border border-neutral-800 transition cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="p-6 space-y-4 overflow-y-auto flex-1 text-sm text-neutral-300">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1">Status</label>
                    <select name="status" class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-neutral-200 focus:border-emerald-500 focus:outline-none">
                        <option value="plan_to_watch" {% if entry.status == 'plan_to_watch' %}selected{% endif %}>Plan to Watch</option>
                        <option value="watching" {% if entry.status == 'watching' %}selected{% endif %}>Watching</option>
                        <option value="completed" {% if entry.status == 'completed' %}selected{% endif %}>Completed</option>
                        <option value="dropped" {% if entry.status == 'dropped' %}selected{% endif %}>Dropped</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1">Rating (1-10)</label>
                    <input type="number" min="1" max="10" step="0.5" name="rating" value="{{ entry.rating or '' }}" 
                           class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-neutral-200 focus:border-emerald-500 focus:outline-none" placeholder="e.g. 8.5">
                </div>

                {% if m_item.media_type == 'tv' %}
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1">Season</label>
                        <input type="number" min="0" name="last_watched_season" value="{{ entry.last_watched_season or 0 }}" 
                               class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-neutral-200 focus:border-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1">Episode</label>
                        <input type="number" min="0" name="last_watched_episode" value="{{ entry.last_watched_episode or 0 }}" 
                               class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-neutral-200 focus:border-emerald-500 focus:outline-none">
                    </div>
                </div>
                {% endif %}

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1">Notes</label>
                    <textarea name="notes" rows="3" 
                              class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-neutral-200 focus:border-emerald-500 focus:outline-none" 
                              placeholder="Personal thoughts, reminders, or review...">{{ entry.notes or '' }}</textarea>
                </div>
            </div>

            <div class="p-4 border-t border-neutral-800 bg-neutral-950 flex items-center justify-between shrink-0">
                <button type="button"
                        hx-get="/titles/info-modal/{{ m_item.tmdb_id }}/{{ m_item.media_type }}"
                        hx-target="#info-modal"
                        hx-swap="outerHTML"
                        class="px-5 py-2 text-sm text-neutral-300 hover:text-white bg-neutral-800 rounded-full hover:bg-neutral-700 font-semibold transition-colors cursor-pointer">
                    Cancel
                </button>
                <button type="submit" 
                        class="px-5 py-2 text-sm text-neutral-950 bg-emerald-500 rounded-full hover:bg-emerald-400 font-extrabold shadow-lg transition-all cursor-pointer">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
