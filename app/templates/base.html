<!DOCTYPE html>
<html lang="en" class="h-full bg-neutral-950 text-neutral-100 selection:bg-emerald-500 selection:text-neutral-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevDB{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-neutral-950 text-neutral-100">

    <!-- Universal Nav Partial -->
    {% include "partials/navbar.html" %}

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- HTMX Modal Mount Point -->
    <div id="modal-container"></div>

    <footer class="py-8 text-center text-xs text-neutral-500">
        <p>Made with <span class="text-rose-500 font-bold">&lt;3</span> for Devin</p>
        <p>Free subdomain provided by <a href="https://freedns.afraid.org/">Free DNS</a></p>
    </footer>
</body>
</html>
