services:
  migration:
    container_name: devdb_migration
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-devdb}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    container_name: devdb_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-devdb}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    labels:
      - "org.opencontainers.image.version=${APP_VERSION:-1.0.0}"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    container_name: devdb_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-devdb}
    volumes:
      - devdb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-devdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

volumes:
  devdb_postgres_data:
    name: devdb_postgres_data
